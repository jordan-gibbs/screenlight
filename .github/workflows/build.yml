name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: screenlight.exe
          - os: macos-latest
            bin: screenlight
          - os: ubuntu-24.04
            bin: screenlight
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: screenlight-${{ runner.os }}
          path: src-tauri/target/release/${{ matrix.bin }}
